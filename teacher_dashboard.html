<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .animate-entrance { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-gray-200 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
                <i class="fas fa-brain text-blue-600"></i> QuizPortal AI
            </h1>
            <button onclick="window.location.href='index.html'" class="text-gray-500 hover:text-red-500 font-medium">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-6">
        
        <div class="bg-white border border-gray-200 rounded-2xl p-6 mb-8 shadow-lg relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-100 rounded-full opacity-50 blur-2xl -mr-10 -mt-10"></div>
            
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fas fa-wand-magic-sparkles text-purple-500"></i> Generator Settings
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Topic</label>
                    <input type="text" id="aiTopic" placeholder="e.g. Java Inheritance, Indian History" 
                           class="w-full p-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Difficulty</label>
                    <select id="aiDifficulty" class="w-full p-3 rounded-lg border border-gray-300 bg-white cursor-pointer focus:border-blue-500 outline-none">
                        <option value="Easy">🟢 Easy</option>
                        <option value="Medium" selected>🟡 Medium</option>
                        <option value="Hard">🔴 Hard</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Question Type</label>
                    <select id="aiType" class="w-full p-3 rounded-lg border border-gray-300 bg-white cursor-pointer focus:border-blue-500 outline-none">
                        <option value="MCQ">🔘 Single Choice (MCQ)</option>
                        <option value="MSQ">☑️ Multi Select (MSQ)</option>
                        <option value="DESC">📝 Descriptive / Short</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Count</label>
                    <input type="number" id="aiCount" value="5" min="1" max="10" class="w-full p-3 rounded-lg border border-gray-300 outline-none">
                </div>

                <div class="md:col-span-4">
                    <button onclick="generateQuiz()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 rounded-lg shadow-md transition-all transform hover:scale-[1.01]">
                        ✨ Generate Questions
                    </button>
                </div>
            </div>

            <input type="password" id="apiKeyInput" placeholder="Paste API Key here (if not in code)" class="mt-4 w-full p-2 border rounded text-xs text-gray-400 hidden">
            <div id="aiStatus" class="mt-4 font-semibold text-gray-600 hidden text-center"></div>
        </div>

        <div id="quizContainer" class="space-y-6"></div>

        <div id="saveSection" class="hidden mt-8 bg-white p-6 rounded-xl shadow-lg border-t-4 border-green-500 animate-entrance">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-save text-green-600"></i> Finalize & Save
            </h3>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">Quiz Title</label>
                <input type="text" id="quizTitle" placeholder="e.g. Unit 3 Assessment" class="w-full p-3 rounded-lg border border-gray-300">
                <p id="subjectInfo" class="text-xs text-gray-400 mt-1 italic"></p>
            </div>
              
            <button onclick="saveToDatabase()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md text-lg transition-all">
                Save Quiz to Database
            </button>
        </div>

    </div>

    <script>
        // 🔑 PASTE YOUR API KEY HERE
        let API_KEY = "your_api_key"; 

        // GLOBAL VARIABLE TO HOLD AUTO-DETECTED SUBJECT
        let CURRENT_SUBJECT_ID = 1; // Default fallback

        // 1. AUTO-FETCH SUBJECTS FROM ADMIN PANEL (DATABASE)
        window.onload = async function() {
            try {
                // Fetch subjects created by Admin
                const res = await fetch('api/quiz.php?action=get_subjects');
                const data = await res.json();
                
                if(data.subjects && data.subjects.length > 0) {
                    // AUTOMATICALLY PICK THE FIRST SUBJECT
                    const firstSubject = data.subjects[0];
                    CURRENT_SUBJECT_ID = firstSubject.id;
                    
                    console.log(`Auto-selected Subject: ${firstSubject.name} (ID: ${firstSubject.id})`);
                    document.getElementById('subjectInfo').innerText = `Auto-assigned to Subject: ${firstSubject.name}`;
                } else {
                    console.warn("No subjects found in DB. Using Default ID: 1");
                }
            } catch(e) { 
                console.error("Subject Fetch Error. Using Default ID: 1", e); 
            }
        };

        // 2. Helper: Find working AI Model
        async function getWorkingModel() {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                if (!response.ok) throw new Error("API Key Error");
                const data = await response.json();
                const availableModels = data.models.filter(m => m.supportedGenerationMethods.includes("generateContent"));
                const preferred = availableModels.find(m => m.name.includes("flash")) || 
                                  availableModels.find(m => m.name.includes("pro")) || 
                                  availableModels[0];
                return preferred ? preferred.name.replace("models/", "") : "gemini-1.5-flash";
            } catch (e) {
                return "gemini-1.5-flash";
            }
        }

        // 3. Generate Logic
        async function generateQuiz() {
            const topic = document.getElementById('aiTopic').value.trim();
            const count = document.getElementById('aiCount').value;
            const diff = document.getElementById('aiDifficulty').value;
            const type = document.getElementById('aiType').value;
            const status = document.getElementById('aiStatus');
            const container = document.getElementById('quizContainer');

            const userKey = document.getElementById('apiKeyInput').value;
            if(userKey.length > 5) API_KEY = userKey;

            if (!topic) { alert("Enter a topic!"); return; }
            if (!API_KEY || API_KEY.length < 10) { alert("Please enter a valid API Key."); return; }

            // UI Loading
            status.classList.remove('hidden');
            status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Detecting AI Model...`;
            container.innerHTML = "";

            try {
                const modelName = await getWorkingModel();
                status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Generating ${type} via ${modelName}...`;

                // Customize Prompt
                let prompt = "";
                if (type === "MCQ") {
                    prompt = `Generate ${count} ${diff} level Multiple Choice Questions (MCQ) on "${topic}".
                    Strictly return ONLY a JSON Array. No markdown.
                    Format: [{"q":"Question text","a":"Option A","b":"Option B","c":"Option C","d":"Option D","correct":"Option A"}]`;
                } else if (type === "MSQ") {
                    prompt = `Generate ${count} ${diff} level Multiple Select Questions (MSQ) on "${topic}".
                    Strictly return ONLY a JSON Array. No markdown.
                    Format: [{"q":"Question text","a":"Option A","b":"Option B","c":"Option C","d":"Option D","correct":"Option A, Option C"}]`;
                } else if (type === "DESC") {
                    // Optimized prompt to keep answers concise for the grader
                    prompt = `Generate ${count} ${diff} level Descriptive/Short Answer questions on "${topic}".
                    Strictly return ONLY a JSON Array. No markdown.
                    Do NOT write full paragraphs for the answer. Provide only 5 to 8 essential comma-separated keywords as the answer.
                    Format: [{"q":"Question text","answer":"keyword 1, keyword 2, keyword 3"}]`;
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const firstBracket = text.indexOf('[');
                const lastBracket = text.lastIndexOf(']');
                if (firstBracket !== -1 && lastBracket !== -1) {
                    text = text.substring(firstBracket, lastBracket + 1);
                }

                const questions = JSON.parse(text);
                renderQuestions(questions, type);
                
                status.innerHTML = `<span class="text-green-600 font-bold"><i class="fas fa-check-circle"></i> Success! Generated ${type}.</span>`;
                document.getElementById('saveSection').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                status.innerHTML = `<span class="text-red-600">Error: ${error.message}</span>`;
            }
        }

        // 4. Render Questions
        function renderQuestions(questions, type) {
            const container = document.getElementById('quizContainer');
            container.innerHTML = "";
            
            questions.forEach((q, index) => {
                let badgeColor = 'bg-blue-100 text-blue-700';
                if(type === 'MSQ') badgeColor = 'bg-purple-100 text-purple-700';
                if(type === 'DESC') badgeColor = 'bg-orange-100 text-orange-700';

                let html = `
                <div class="question-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-4 group relative">
                    <button onclick="this.closest('.question-card').remove()" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition-colors"><i class="fas fa-trash"></i></button>

                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-xs font-bold px-2 py-1 rounded border ${badgeColor}">${type}</span>
                        <span class="text-xs font-bold text-gray-400 uppercase">Q${index + 1}</span>
                    </div>

                    <input type="text" name="q_text" value="${q.q.replace(/"/g, '&quot;')}" class="w-full p-3 mb-3 bg-gray-50 border rounded font-bold text-gray-800">`;

                if (type === 'MCQ' || type === 'MSQ') {
                    html += `
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div class="flex items-center gap-2"><span class="font-bold text-gray-400">A</span> <input type="text" name="opt_a" value="${q.a.replace(/"/g, '&quot;')}" class="w-full p-2 border rounded"></div>
                        <div class="flex items-center gap-2"><span class="font-bold text-gray-400">B</span> <input type="text" name="opt_b" value="${q.b.replace(/"/g, '&quot;')}" class="w-full p-2 border rounded"></div>
                        <div class="flex items-center gap-2"><span class="font-bold text-gray-400">C</span> <input type="text" name="opt_c" value="${q.c.replace(/"/g, '&quot;')}" class="w-full p-2 border rounded"></div>
                        <div class="flex items-center gap-2"><span class="font-bold text-gray-400">D</span> <input type="text" name="opt_d" value="${q.d.replace(/"/g, '&quot;')}" class="w-full p-2 border rounded"></div>
                    </div>
                    <div class="bg-green-50 p-2 rounded border border-green-200">
                        <span class="text-xs font-bold text-green-700 uppercase">Correct Answer(s):</span>
                        <input type="text" name="correct" value="${Array.isArray(q.correct) ? q.correct.join(', ') : q.correct}" class="w-full bg-transparent font-bold text-green-800 outline-none">
                    </div>`;
                } 
                else if (type === 'DESC') {
                    html += `
                    <div class="bg-yellow-50 p-3 rounded border border-yellow-200">
                        <span class="text-xs font-bold text-yellow-700 uppercase">Suggested Answer Key:</span>
                        <textarea name="correct" class="w-full bg-transparent p-2 text-gray-800 h-20 outline-none">${q.answer || ''}</textarea>
                        <input type="hidden" name="opt_a" value=""><input type="hidden" name="opt_b" value="">
                        <input type="hidden" name="opt_c" value=""><input type="hidden" name="opt_d" value="">
                    </div>`;
                }

                html += `<input type="hidden" name="q_type" value="${type}"></div>`;
                container.innerHTML += html;
            });
        }

        // 5. Save to Database (FIXED & ERROR-PROOF)
        async function saveToDatabase() {
            const btn = document.querySelector('button[onclick="saveToDatabase()"]');
            const title = document.getElementById('quizTitle').value;
            const cards = document.querySelectorAll('.question-card');

            if(!title) { alert("Enter Quiz Title!"); return; }
            if(cards.length === 0) { alert("No questions to save!"); return; }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Quiz Shell...';

            try {
                // 1. Save the Quiz Shell
                const quizRes = await fetch('api/quiz.php?action=save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        title: title, 
                        description: "AI Generated", 
                        duration: 10, 
                        subject_id: CURRENT_SUBJECT_ID 
                    })
                });
                
                const responseText = await quizRes.text();
                let quizData;
                try { quizData = JSON.parse(responseText); } 
                catch(e) { throw new Error("Server Error on Quiz Shell: " + responseText); }
                
                if(!quizData.success) throw new Error(quizData.message);

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Questions...';

                // 2. Save Each Question
                for (const card of cards) {
                    const type = card.querySelector('[name="q_type"]').value; 
                    let correctVal = card.querySelector('[name="correct"]').value;
                    const getOpt = (name) => card.querySelector(`[name="${name}"]`) ? card.querySelector(`[name="${name}"]`).value : "";

                    // SCRUB THE AI OUTPUT: Convert "Option A" to "a" so the database doesn't crash
                    if (type === 'MCQ' || type === 'MSQ') {
                        correctVal = correctVal.replace(/Option\s+/ig, '').trim().toLowerCase(); 
                    }

                    // Prepare the Payload
                    const qPayload = {
                        quiz_id: quizData.quiz_id,
                        question_text: card.querySelector('[name="q_text"]').value,
                        option_a: getOpt('opt_a'),
                        option_b: getOpt('opt_b'),
                        option_c: getOpt('opt_c'),
                        option_d: getOpt('opt_d'),
                        correct_option: correctVal, 
                        marks: 1, 
                        type: type,
                        question_type: type // Send both to ensure backend catches it
                    };

                    // Send to database
                    const qRes = await fetch('api/question.php?action=add', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(qPayload)
                    });
                    
                    const qText = await qRes.text();
                    
                    // STRICT ERROR CHECKING: If a question fails, stop and alert!
                    try {
                        const qData = JSON.parse(qText);
                        if (!qData.success) {
                            throw new Error(qData.message || "Database rejected the question.");
                        }
                    } catch (err) {
                        console.error("🔥 Raw DB Error:", qText);
                        throw new Error("Question Failed to Save: " + (err.message || qText));
                    }
                }
                
                alert(" Quiz & All Questions Saved Successfully!");
                window.location.href = 'index.html';
                
            } catch (e) {
                console.error("Save Error:", e);
                alert(" Error: " + e.message);
                btn.disabled = false;
                btn.innerHTML = 'Save Quiz to Database';
            }
        }
    </script>
</body>
</html>
